<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Friction — an interactive collection inspired by your favourite fictional worlds."
  >

  <title>Friction</title>

  <link rel="icon" type="image/png" href="/friction-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  >
</head>

<body>
  <div
    class="opening-screen"
    id="openingScreen"
    aria-hidden="true"
    data-html2canvas-ignore
  >
    <div class="opening-content">
      <span>FRICTION</span>
    </div>
  </div>

  <div class="cursor-dot" aria-hidden="true" data-html2canvas-ignore></div>
  <div class="cursor-ring" aria-hidden="true" data-html2canvas-ignore></div>

  <div id="app">
    <div class="background" aria-hidden="true">
      <div id="prism-container" data-html2canvas-ignore></div>
      <div class="grain"></div>
      <div class="glow glow-one"></div>
      <div class="glow glow-two"></div>
    </div>

    <header class="navbar">
      <div class="logo">FRICTION</div>

      <nav class="nav-right" aria-label="Main navigation">
        <span>ENTER A STORY</span>

        <button
          id="themeButton"
          type="button"
          aria-haspopup="dialog"
          aria-controls="themePanel"
        >
          THEME
        </button>
        
      </nav>
    </header>

    <main class="landing">
      <section class="intro" aria-labelledby="introTitle">
        <p class="eyebrow">AN INTERACTIVE COLLECTION</p>

        <h1 id="introTitle">
          Step into<br>
          <span>the story.</span>
        </h1>

        <p class="description">
          Don't watch from the outside.
          Enter the worlds you already know.
        </p>
      </section>

      <section
        class="doors"
        id="doors"
        aria-label="Choose a story — rooms coming soon"
      >
        <button
          type="button"
          class="door"
          data-show="Dexter"
          data-number="01"
          aria-label="Dexter — coming soon"
        >
          <span class="door-number">01</span>
          <span class="door-image">
            <img src="/images/shows/dexter.jpg" alt="" decoding="async">
          </span>
          <span class="door-title">Dexter</span>
        </button>

        <button
          type="button"
          class="door"
          data-show="Friends"
          data-number="02"
          aria-label="Friends — coming soon"
        >
          <span class="door-number">02</span>
          <span class="door-image">
            <img src="/images/shows/friends.jpg" alt="" decoding="async">
          </span>
          <span class="door-title">Friends</span>
        </button>

        <button
          type="button"
          class="door"
          data-show="How I Met Your Mother"
          data-number="03"
          aria-label="How I Met Your Mother — coming soon"
        >
          <span class="door-number">03</span>
          <span class="door-image">
            <img src="/images/shows/himym.jpg" alt="" decoding="async">
          </span>
          <span class="door-title">How I Met Your Mother</span>
        </button>

        <button
          type="button"
          class="door"
          data-show="The Mentalist"
          data-number="04"
          aria-label="The Mentalist — coming soon"
        >
          <span class="door-number">04</span>
          <span class="door-image">
            <img src="/images/shows/mentalist.jpg" alt="" decoding="async">
          </span>
          <span class="door-title">The Mentalist</span>
        </button>

        <button
          type="button"
          class="door"
          data-show="Breaking Bad"
          data-number="05"
          aria-label="Breaking Bad — coming soon"
        >
          <span class="door-number">05</span>
          <span class="door-image">
            <img src="/images/shows/breaking-bad.jpg" alt="" decoding="async">
          </span>
          <span class="door-title">Breaking Bad</span>
        </button>

        <button
          type="button"
          class="door"
          data-show="Psych"
          data-number="06"
          aria-label="Psych — coming soon"
        >
          <span class="door-number">06</span>
          <span class="door-image">
            <img src="/images/shows/psych.jpg" alt="" decoding="async">
          </span>
          <span class="door-title">Psych</span>
        </button>

        <button
          type="button"
          class="door"
          data-show="Suits"
          data-number="07"
          aria-label="Suits — coming soon"
        >
          <span class="door-number">07</span>
          <span class="door-image">
            <img src="/images/shows/suits.jpg" alt="" decoding="async">
          </span>
          <span class="door-title">Suits</span>
        </button>

        <button
          type="button"
          class="door"
          data-show="House"
          data-number="08"
          aria-label="House — coming soon"
        >
          <span class="door-number">08</span>
          <span class="door-image">
            <img src="/images/shows/house.jpg" alt="" decoding="async">
          </span>
          <span class="door-title">House</span>
        </button>

        <button
          type="button"
          class="door"
          data-show="Peaky Blinders"
          data-number="09"
          aria-label="Peaky Blinders — coming soon"
        >
          <span class="door-number">09</span>
          <span class="door-image">
            <img src="/images/shows/peaky-blinders.jpg" alt="" decoding="async">
          </span>
          <span class="door-title">Peaky Blinders</span>
        </button>
      </section>
    </main>

    <footer class="footer">
      <span>FRICTION / 2026</span>
      <span>STORY ROOMS COMING SOON</span>
    </footer>
  </div>

  <div
    class="transition"
    id="transition"
    role="status"
    aria-live="polite"
    tabindex="-1"
    data-html2canvas-ignore
  >
    <div class="transition-content">
      <span class="transition-number" id="transitionNumber">01</span>
      <h2 id="transitionTitle">DEXTER</h2>
      <p id="transitionStatus">ENTERING STORY</p>
    </div>
  </div>

  <div
    class="theme-panel"
    id="themePanel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="themeTitle"
    aria-hidden="true"
    data-html2canvas-ignore
  >
    <div class="theme-panel-inner">
      <div class="theme-panel-header">
        <span id="themeTitle">SELECT THEME</span>
        <button type="button" id="closeTheme">CLOSE ×</button>
      </div>

      <button
        type="button"
        class="theme-option active"
        data-theme="dark"
        aria-pressed="true"
      >
        <span class="theme-preview theme-preview-dark"></span>
        <span class="theme-option-text">
          <strong>DARK</strong>
          <small>OBSIDIAN</small>
        </span>
        <span class="theme-check" aria-hidden="true">✓</span>
      </button>

      <button
        type="button"
        class="theme-option"
        data-theme="light"
        aria-pressed="false"
      >
        <span class="theme-preview theme-preview-light"></span>
        <span class="theme-option-text">
          <strong>LIGHT</strong>
          <small>IVORY</small>
        </span>
        <span class="theme-check" aria-hidden="true">✓</span>
      </button>

      <button
        type="button"
        class="theme-option"
        data-theme="venice"
        aria-pressed="false"
      >
        <span class="theme-preview theme-preview-venice"></span>
        <span class="theme-option-text">
          <strong>VENICE</strong>
          <small>OCEANIC</small>
        </span>
        <span class="theme-check" aria-hidden="true">✓</span>
      </button>
    </div>
  </div>

  <div
    id="marvel-tribute"
    role="dialog"
    aria-modal="true"
    aria-label="Marvel tribute"
    aria-hidden="true"
    data-html2canvas-ignore
  >
    <button type="button" id="closeMarvel">CLOSE ×</button>

    <div class="marvel-video-wrapper">
      <video
        id="marvel-video"
        playsinline
        preload="none"
        controls
        src="/videos/marvel-intro.mp4"
      ></video>

      <button type="button" id="playMarvel" hidden>
        PLAY TRIBUTE
      </button>
    </div>
  </div>

  <noscript>
    <p class="noscript-message">
      Enable JavaScript to use themes and interactive features.
      Story rooms are coming soon.
    </p>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
